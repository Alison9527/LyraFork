; MazeDemo GameFeature 专用配置。
; 这些 ini 会被 merge 进 config stack，但仅在本插件被加载（即挂载了对应 Experience）时生效，
; 停用就自动还原 —— 这正是我们不去改项目级 Project Settings 的原因。

; RuntimeGeneration 声明在 ANavigationData 上（Engine/Source/Runtime/NavigationSystem/Public/NavigationData.h:583，
; 标记为 config），所以段名必须是 [/Script/NavigationSystem.NavigationData]，
; 而不是 RecastNavMesh —— ANavigationData 自身是 config=Engine，故写在 DefaultEngine.ini。
; 合法取值：Static / DynamicModifiersOnly / Dynamic
[/Script/NavigationSystem.NavigationData]
RuntimeGeneration=Dynamic

; 注意：即使这里不改，编辑器世界中永远按 Dynamic 处理（见 NavigationSystem.h:1435 注释）。
; 此配置真正影响的是打包后的 Game / Server 构建。
